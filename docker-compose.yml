services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: sapa
      POSTGRES_PASSWORD: sapa
      POSTGRES_DB: voicedb
    ports: ["5432:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sapa -d voicedb"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+asyncpg://sapa:sapa@postgres:5432/voicedb
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}

  worker:
    build: .
    entrypoint: []
    command: ["python", "-m", "app.workers.request_worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://sapa:sapa@postgres:5432/voicedb
      REDIS_URL: redis://redis:6379/0
    depends_on:
      api: {condition: service_started}

volumes:
  pgdata: